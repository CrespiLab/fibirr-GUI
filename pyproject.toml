[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibirr-core"
version = "2.0.0"
description = "Minimal Python interface for an Avantes-based fibre-optic spectrometer"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Jorn Steen", email = "jorn.steen@kemi.uu.se" },
]
keywords = ["science", "spectroscopy", "avantes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Spectroscopy",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/CrespiLab/fibirr-GUI"

[tool.setuptools]
packages = ["fibirr_core"]
